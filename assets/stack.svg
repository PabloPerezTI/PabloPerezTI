<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d"><title id="t">Tech stack grouped by pipeline stage</title><desc id="d">Ingest: Auto Loader, AWS Glue, Lambda, EventBridge, Kafka. Process: PySpark, Spark SQL, Declarative Pipelines, Python, pandas. Store and govern: Delta Lake, Unity Catalog, S3, Snowflake, PostgreSQL. Orchestrate: Lakeflow Jobs, Airflow, Asset Bundles, Docker, GitHub Actions. Serve: Athena, QuickSight, Databricks Apps, Flask.</desc><style>@font-face{font-family:'PPTitle';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'PPText';src:url(data:font/woff2;base64,) format('woff2');}.PPTitle{font-family:'PPTitle',Helvetica,Arial,sans-serif;}.PPText{font-family:'PPText',Helvetica,Arial,sans-serif;}</style><defs><linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="64" x2="1082" y1="0" y2="0"><stop offset="0" stop-color="#C07A45"/><stop offset="0.5" stop-color="#B8C4CC"/><stop offset="1" stop-color="#E3B448"/></linearGradient></defs><rect width="1200" height="330" rx="16" fill="#0F2A3D"/><line x1="64" x2="1082" y1="58" y2="58" stroke="url(#flow)" stroke-width="3" stroke-linecap="round"/><circle cx="71" cy="58" r="8" fill="#0F2A3D" stroke="#C07A45" stroke-width="3"/><text x="64" y="108" class="PPTitle" font-size="20" fill="#EAF2F5">Ingest</text><text x="64" y="150" class="PPText" font-size="17.5" fill="#EAF2F5" opacity="0.78">Auto Loader</text><text x="64" y="182" class="PPText" font-size="17.5" fill="#EAF2F5" opacity="0.78">AWS Glue</text><text x="64" y="214" class="PPText" font-size="17.5" fill="#EAF2F5" opacity="0.78">AWS Lambda</text><text x="64" y="246" class="PPText" font-size="17.5" fill="#EAF2F5" opacity="0.78">Amazon EventBridge</text><text x="64" y="278" class="PPText" font-size="17.5" fill="#EAF2F5" opacity="0.78">Apache Kafka</text><circle cx="303" cy="58" r="8" fill="#0F2A3D" stroke="#C69E83" stroke-width="3"/><text x="296" y="108" class="PPTit
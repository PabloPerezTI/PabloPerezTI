name: Contribution snake

# Redraws the contribution grid every day, colored with the profile's
# bronze, silver and gold palette, and publishes it to the `output` branch.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#0F2A3D&color_dots=#E6ECEF,#E7C7AC,#C07A45,#8FA9B8,#E3B448
            dist/snake-dark.svg?color_snake=#EAF2F5&color_dots=#152C3C,#6E4A31,#C07A45,#B8C4CC,#E3B448

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
